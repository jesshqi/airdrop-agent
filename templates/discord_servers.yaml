# ~/.airdrop-agent/discord_servers.yaml — config chat_grinder.py (OPT-IN, melanggar ToS Discord, akun khusus saja)
defaults:
  active_hours: ["09:00-11:30", "19:30-23:00"]   # WIB; di luar jam ini "tidur"
  daily_cap: 50              # batas keras pesan/hari/server
  min_delay_s: 90            # jeda antar pesan dalam satu sesi
  max_delay_s: 420
  session_msgs: [3, 8]       # pesan per sesi (burst), lalu istirahat
  session_break_min: [30, 120]
  skip_day_prob: 0.12        # kadang libur sehari penuh
  reaction_prob: 0.08
  organic_reply_prob: 0.55   # peluang membalas pesan member terbaru (selain yang mention/reply ke kita)
  lowercase_prob: 0.5
  typo_prob: 0.03
  emoji_prob: 0.12
  max_chars: 140
  history_window: 25
  language: en

servers:
  - name: example-project
    enabled: false                     # nyalakan setelah semua dicek
    guild_id: 100000000000000000
    channel_ids: [100000000000000001]  # HANYA #general / #chat. Announcement/support/ticket/rules otomatis ditolak
    language: en                       # id | en (ikuti bahasa channel)
    target:
      messages: 400                    # target jumlah pesan (info + stop kalau tanpa role)
      level: 10                        # level MEE6/Arcane yang memberi role
      role_name: "Active Member"       # atau role_id: 123...
    leveling_bots: [MEE6, Arcane, Lurkr, Amari]
    persona: "builder santai yang suka testnet, sopan, kadang bercanda, tidak shill"
    rules_summary: "English only in #general, no spam, no self-promo, no links, no begging for roles/WL, no DMs"
    banned_words: [airdrop, wl, whitelist, role, level, wen, token price, moon]

  - name: contoh-komunitas-indo
    enabled: false
    guild_id: 200000000000000000
    channel_ids: [200000000000000001]
    language: id
    daily_cap: 35
    active_hours: ["10:00-12:00", "20:00-23:30"]
    target: {level: 5, role_name: "OG"}
    persona: "anak crypto lokal, santai, ngobrolin update project & teknologi, tidak lebay"
    rules_summary: "Bahasa Indonesia, sopan, no spam, no link, no minta role"
    banned_words: [minta role, kasih wl, airdrop kapan]
