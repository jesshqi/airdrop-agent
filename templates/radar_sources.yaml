# ~/.airdrop-agent/radar_sources.yaml — sumber & aturan radar airdrop (scripts/radar/)
# Isi target sendiri. Placeholder di bawah BUKAN rekomendasi channel/akun.
settings:
  min_score: 55                 # di bawah ini: dicatat saja, tidak dibuat task / tidak dilaporkan
  auto_approve_low_risk: false  # true = task TANPA wallet/sign (join TG, follow X, waitlist email) dari domain allowlist langsung 'pending'
  digest: true                  # kirim temuan ke Telegram (dengan kode approve/reject)
  digest_max_per_hour: 12       # anti banjir notifikasi
  dedupe_days: 14
  poll_interval_min: {x: 30, tg_backfill: 60}
  tg_join_cap_per_day: 15       # akun baru: mulai 5-10
  tg_join_delay_s: [45, 180]
  x_follow_cap_per_day: 10
  x_max_reads_per_day: 300      # X API bayar per post dibaca ($0.005/post) -> 300/hari ≈ $1.5/hari
  x_max_results_per_call: 10
  llm_classifier: false         # true = pakai LLM OpenAI-compatible (RADAR_LLM_* atau GRIND_LLM_* di .env)
  online_research: true         # true = research_score (RDAP umur domain + fetch halaman) untuk kandidat lolos min_score

telegram:                       # channel / grup yang di-subscribe & dipantau
  - {target: "@example_airdrop_channel", trust: 0.6, kind: channel}
  - {target: "@example_testnet_alpha", trust: 0.7, kind: channel}
  - {target: "https://t.me/+ExampleInviteHash", trust: 0.4, kind: group}

x_accounts:                     # akun yang di-follow & timeline-nya dipantau
  - {handle: "example_alpha_hunter", trust: 0.7, follow: true}
  - {handle: "example_project_official", trust: 0.9, follow: true, official_domain: "example.org"}

x_queries:                      # pencarian X (recent search, 7 hari). Tiap hasil = biaya baca
  - '(airdrop OR testnet OR "points program") (galxe OR zealy OR layer3 OR intract) -giveaway -is:retweet lang:en'
  - '(airdrop OR garapan OR testnet) (faucet OR galxe) -is:retweet lang:in'

keywords:
  include: [airdrop, testnet, faucet, galxe, zealy, layer3, questn, intract, quest, whitelist, waitlist, points, poin,
            retro, retroactive, snapshot, claim, incentivized, garapan, early access, season, campaign, mini app, node]
  exclude: [giveaway, "send eth", "send sol", presale, "100x", casino, "double your", "dm me", pump, "guaranteed",
            "private key", "seed phrase", recovery]
  high_risk: [claim, "connect wallet", eligible, eligibility, checker, "claim now", "airdrop is live", "claim your",
              "check eligibility", unlock, "limited time", migrate, "validate"]

platforms:                      # domain -> tipe task (untuk risiko rendah)
  galxe.com: galxe
  zealy.io: zealy
  layer3.xyz: layer3
  questn.com: questn
  intract.io: intract
  taskon.xyz: taskon
  guild.xyz: guild
  getwaitlist.com: waitlist
  typeform.com: waitlist
  tally.so: waitlist
  t.me: telegram
  discord.gg: discord
  discord.com: discord
  x.com: x
  twitter.com: x

# Template task per tipe (key, type task_queue, butuh wallet?). {url} {handle} {peer} {ref} diganti otomatis.
task_templates:
  galxe:     [{key: galxe, type: web, wallet: true,  params: {mode: agent, url: "{url}"}}]
  zealy:     [{key: zealy, type: web, wallet: false, params: {mode: agent, url: "{url}"}}]
  layer3:    [{key: layer3, type: web, wallet: true, params: {mode: agent, url: "{url}"}}]
  questn:    [{key: questn, type: web, wallet: true, params: {mode: agent, url: "{url}"}}]
  intract:   [{key: intract, type: web, wallet: true, params: {mode: agent, url: "{url}"}}]
  taskon:    [{key: taskon, type: web, wallet: true, params: {mode: agent, url: "{url}"}}]
  guild:     [{key: guild, type: manual, wallet: true, params: {note: "Guild role check (sign) — manual", url: "{url}"}}]
  waitlist:  [{key: waitlist, type: web, wallet: false, params: {mode: agent, url: "{url}", fill_email: true}}]
  telegram:  [{key: "tg-{peer}", type: telegram, wallet: false, params: {action: join, peer: "{peer}"}}]
  tg-miniapp: [{key: "miniapp-{peer}", type: telegram, wallet: false, params: {action: start, peer: "{peer}", ref: "{ref}"}}]
  x:         [{key: "x-{handle}", type: x, wallet: false, params: {action: follow, handle: "{handle}"}}]
  discord:   [{key: discord, type: manual, wallet: false, params: {note: "Join + verify Discord (manual / browser)", url: "{url}"}}]
  faucet:    [{key: faucet, type: manual, wallet: false, params: {note: "Faucet (sering captcha) — hand-off", url: "{url}"}}]
  testnet:   [{key: research, type: research, wallet: false, params: {url: "{url}"}},
              {key: onboarding, type: manual, wallet: true, params: {note: "Baca docs testnet, tambah chain ke policy.yaml", url: "{url}"}}]
  claim:     []                 # TIDAK PERNAH dibuat otomatis — hanya review manusia
