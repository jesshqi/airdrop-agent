# Galxe-style quest. Social tasks (follow/retweet) open X in the SAME logged-in profile.
allowed_domains: [galxe.com, x.com, twitter.com, discord.com]
steps:
  - {action: goto, url: "https://app.galxe.com/quest/EXAMPLE/GCxxxx"}
  - {action: wait, ms: 4000}
  - {action: screenshot, name: galxe_before}
  - {action: extract_text, selector: "main"}
  - {action: click, text: "Follow", exact: false}
  - {action: wait, ms: 5000}
  - {action: click, text: "Verify"}
  - {action: wait, ms: 5000}
  - {action: wallet, note: "Kalau Galxe minta connect/sign: konfirmasi manual di VNC (SIWE galxe.com saja)"}
  - {action: click, text: "Claim"}
  - {action: wait, ms: 4000}
  - {action: screenshot, name: galxe_done}
